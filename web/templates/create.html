{{ define "create"}}
<!-- Define the "create" template -->

{{ template "Header" .}} <!-- Include the "Header" template -->

<main role="main" class="inner cover">
    <h1 class="cover-heading">Write Post</h1>
<form action="/save_post" method="POST">
  <input type="text" name="title" class="form-control" placeholder="Title" required><br>

  <textarea name="anons" class="form-control" placeholder="Short description" required></textarea><br>

  <textarea name="full_text" class="form-control" placeholder="Full text" required></textarea><br>

  <button type="submit" class="btn btn-warning">Create</button>
</form>
</main>

<hr class="Ar">

{{ template "Footer"}} <!-- Include the "Footer" template -->

{{ end }}
