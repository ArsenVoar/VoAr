{{ define "post" }}

{{ template "Header" . }}

<main role="main" class="inner cover">
{{ if . }}
  {{ range .Data }}
    <div class="alert alert-danger">
      <h2>{{ .Title }}</h2>
      <p>{{ .Anons }}</p>
      <a href="/show/{{ .Id }}" class="btn btn-danger">Read more</a>
    </div>
  {{ end }}
{{ else }}
  <p>No posts yet</p>
{{ end }}
</main>

{{ template "Footer" }}

{{ end }}
